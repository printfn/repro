[package]
name = "repro"
version = "0.1.0"
authors = ["printfn <printfn@users.noreply.github.com>"]
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2.100"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz"]

[profile.release]
lto = true
opt-level = "z"
strip = "symbols"
